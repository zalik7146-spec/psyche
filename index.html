<!doctype html>
<html lang="ru" data-theme="light" style="height:100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Core -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Psyche" />
    <meta name="application-name" content="Psyche" />
    <meta name="theme-color" content="#F1EDE5" />
    <meta name="msapplication-TileColor" content="#F1EDE5" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- SEO -->
    <meta name="description" content="Psyche — пространство для штудирования книг, мыслей и инсайтов. Умный дневник психолога." />
    <meta name="keywords" content="заметки, книги, психология, дневник, штудирование, инсайты" />
    <meta name="author" content="Psyche App" />

    <!-- Open Graph -->
    <meta property="og:title" content="Psyche — Дневник Разума" />
    <meta property="og:description" content="Пространство для штудирования книг и записи мыслей" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Splash screens for iPhone -->
    <meta name="apple-touch-fullscreen" content="yes" />

    <title>Psyche — Дневник Разума</title>

    <!--
      ИСПРАВЛЕНО:
      1. connect-src: добавлен https://api.allorigins.win (был allorigins.win без api.)
                      добавлен https://books.googleapis.com (Google Books API)
                      добавлен https://www.googleapis.com (Google APIs)
      2. img-src: добавлен https://*.googleapis.com (обложки Google Books)
                  добавлен https://*.ggpht.com (CDN Google Books covers)
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://openlibrary.org
        https://covers.openlibrary.org
        https://api.allorigins.win
        https://www.googleapis.com
        https://books.googleapis.com
        https://gutendex.com
        https://www.gutenberg.org;
      font-src 'self'
        https://fonts.googleapis.com
        https://fonts.gstatic.com
        data:;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com;
      img-src 'self'
        data:
        blob:
        https://covers.openlibrary.org
        https://books.google.com
        https://books.googleapis.com
        https://*.googleapis.com
        https://*.ggpht.com
        https://www.gutenberg.org
        https://*.supabase.co;
      script-src 'self' 'unsafe-inline';
      media-src 'self' blob: data: https://*.supabase.co;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Тема до первой отрисовки, чтобы ночная бумага не мигала светлой
      (function () {
        try {
          var t = localStorage.getItem('psyche_theme') || 'light';
          if (t === 'auto') { var h = new Date().getHours(); t = (h < 7 || h >= 21) ? 'dark' : 'light'; }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Prevent flash of unstyled content — critical path styles */
      *, *::before, *::after { box-sizing: border-box; }
      html { --c-desk: #DDD7CB; --c-bg: #F1EDE5; --c-card: #F9F6EF; --c-line: #D6CFC1; --c-ink: #1B1A17; color: var(--c-ink); }
      html[data-theme="dark"] { --c-desk: #0A0908; --c-bg: #12110F; --c-card: #1D1B18; --c-line: #35312B; --c-ink: #E9E3D6; }
      html[data-theme="sepia"] { --c-desk: #D5CAB3; --c-bg: #E8DFCC; --c-card: #F2EADA; --c-line: #CDBFA3; --c-ink: #2A2218; }
      html {
        background: var(--c-bg);
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--c-desk);
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, sans-serif;
      }
      #root {
        background: var(--c-bg);
        width: 100%;
        max-width: 430px;
        height: 100dvh;
        height: 100vh;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      /* Splash loader */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: var(--c-bg);
        z-index: 99999;
        transition: opacity 0.4s;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-icon {
        width: 72px; height: 72px; border-radius: 36px;
        background: var(--c-card);
        border: 1px solid var(--c-ink);
        display: flex; align-items: center; justify-content: center;
        font-family: Georgia, serif; font-style: italic; font-size: 34px; color: var(--c-ink);
      }
      #splash-spin {
        width: 24px; height: 24px; border-radius: 50%;
        border: 1px solid var(--c-line); border-top-color: var(--c-ink);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash screen — видим мгновенно, до загрузки JS -->
    <div id="splash">
      <div id="splash-icon">P</div>
      <div id="splash-spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Скрываем splash когда React готов
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 500); }
      };

      // Регистрируем Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
